[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telefon-indirim-takip"
version = "0.1.0"
description = "Katalog tabanlı akıllı telefon fiyat takibi ve indirim tahmini"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic>=2.10,<3", "curl-cffi>=0.7,<1", "beautifulsoup4>=4.12,<5",
  "filelock>=3.16,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "black>=25.1,<27", "flake8>=7.1,<8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
