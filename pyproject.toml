[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telefon-indirim-takip"
version = "0.1.0"
description = "Katalog tabanlı akıllı telefon fiyat takibi ve indirim tahmini"
# Yalnız Python 3.13 test ediliyor (CI ve yerel .venv); aralık buna göre.
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.10,<3", "curl-cffi>=0.7,<1", "beautifulsoup4>=4.12,<5",
  "filelock>=3.16,<4", "psycopg[binary]>=3.2,<4", "tzdata>=2025.2"
]

[project.optional-dependencies]
# Black her yıl ocak sürümünde biçim kurallarını değiştirir; aralık tek yılın
# sürümüne sabit ki yerel ve CI aynı biçimlesin. Yıl atlanırken kod bir kez
# yeniden biçimlenir ve ayrı commit olur.
dev = ["pytest>=8.3,<9", "black>=26.1,<27", "flake8>=7.1,<8"]
web = [
  "fastapi==0.142.4", "uvicorn==0.54.0", "streamlit==1.65.0",
  "psycopg-pool==3.3.3", "httpx==0.28.1", "altair==6.3.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Migration dosyaları kodla birlikte kurulur (düzenlenebilir olmayan kurulumda da).
"app.database" = ["migrations/*.sql"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
